<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0C">
<title>AgentProof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#0A0A0C}
a{color:#C8F135;text-decoration:none}a:hover{color:#E2FF7A}
::selection{background:#C8F135;color:#0A0A0C}
button{font-family:inherit}
textarea{font-family:inherit}
.hv:hover{border-color:#C8F135!important;color:#C8F135!important}
.tn{cursor:pointer;transition:border-color .2s}.tn:hover{border-color:#C8F135!important}
@keyframes ap-pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ap-sweep{from{left:-45%}to{left:125%}}
@keyframes ap-glow{0%,100%{box-shadow:0 0 0 rgba(200,241,53,0)}50%{box-shadow:0 0 26px rgba(200,241,53,.35)}}
</style>
</head>
<body>
<!--AP_REAL-->
<div id="app" style="min-height:100vh;background:#0A0A0C;color:#F4F3EE;font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding:16px 44px;border-bottom:1px solid #232328;position:sticky;top:0;background:rgba(10,10,12,.94);backdrop-filter:blur(8px);z-index:10">
    <div style="display:flex;align-items:center;gap:14px">
      <div style="width:38px;height:38px;background:#C8F135;color:#0A0A0C;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:900;font-size:18px">A</div>
      <div>
        <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;letter-spacing:.6px">AGENTPROOF</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9C9BA0;letter-spacing:.4px">verified by execution, not by claim</div>
      </div>
    </div>
    <nav id="rail" style="display:flex;gap:6px"></nav>
    <div id="chips" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  </header>
  <div id="root"></div>
</div>
<script>
'use strict';
/* ============ tokens ============ */
const LIME='#C8F135',AMBER='#F5B83D',RED='#FF6459',INK='#F4F3EE',MUT='#9C9BA0',DIM='#5F5F66',LINE='#232328',
      PANEL='#131316',INSET='#0E0E11',DIV='#1A1A1E',PIPB='#2A2A30',
      MONO="'IBM Plex Mono',monospace",UNB="'Unbounded',sans-serif",
      GRAD='linear-gradient(90deg,#8CC63F,#C8F135)';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ============ demo controls (URL params: ?speed=1.5&auto=1&budget=0) ============ */
const Q=new URLSearchParams(location.search);
const SIMSPEED=Math.min(2.5,Math.max(.5,parseFloat(Q.get('speed'))||1));
const AUTOADV=Q.get('auto')==='1';
const SHOWBUDGET=Q.get('budget')!=='0';

/* ============ data: real pipeline data if injected, else design-scripted ============ */
const REAL=window.AP_REAL||null;
const SCRIPTED=[
  {id:'eng',nm:'Data Engineering',off:2,exec:1,base:71,ref:96,ka:'clean data · merge disparate sources · run ETL'},
  {id:'dba',nm:'Database Administration',off:2,exec:1,base:40,ref:88,ka:'write & optimise SQL · enforce integrity constraints'},
  {id:'ana',nm:'Data Analytics',off:2,exec:1,base:32,ref:85,ka:'model relationships · validate statistical assumptions'},
  {id:'viz',nm:'Data Visualisation',off:3,exec:1,base:58,ref:94,ka:'shape the data behind the chart · pick honest encodings'},
  {id:'stk',nm:'Stakeholder Management',off:2,exec:0,base:55,ref:70,ka:'rubric-only — scored against the K&A checklist, never executed'},
  {id:'eth',nm:'Data Ethics',off:1,exec:0,base:44,ref:66,ka:'rubric-only — scored against the K&A checklist, never executed'}
];
const S=REAL?REAL.skills:SCRIPTED;
const ROLE=REAL?REAL.role:'Data Analyst / Associate Data Engineer';
const SECTOR=REAL?REAL.sector:'Infocomm Technology';
const IS_DEMO_ROLE=ROLE.startsWith('Data Analyst / Associate Data Engineer');
const ROUNDS=REAL?REAL.rounds:2;
const SPEC_TEXT=REAL?REAL.spec:null;
const SALARY=REAL?REAL.salary:{low:4200,high:7800,live:false};
const TEAM=(REAL&&REAL.team)?REAL.team:{
  name:'Data pipeline team — fixed demo path',
  purpose:'One deterministic route for the demo: each stage consumes the previous stage’s real artifact.',
  agents:[
    {id:'data-engineer',stage:1,role:'Data Engineer',anchor:false,execItems:1,
     enrich:'2 live postings · 12 tools · matched via tfidf',salary:'S$5.8k – 12k',
     produces:'clean, validated dataset artifact',consumes:null,
     sk:[['Data Engineering',3,1],['Database Administration',3,1],['Data Analytics and Computational Modelling',3,1],
         ['Configuration Tracking',1,0],['Configuration Tracking',2,0],['Business Needs Analysis',2,0],
         ['Ethical Culture',3,0],['Data Collection and Analysis',3,0],['Impact Indicators, Measurement and Reporting',3,0],
         ['Software Configuration',3,0],['Programming and Coding',3,0],['Emerging Technology Synthesis',3,0],
         ['Data Design',3,0],['Stakeholder Management',3,0],['Computational Modelling',3,0],
         ['Security Architecture',3,0],['Strategy Implementation',3,0],['Change Management',3,0],
         ['Data Migration',3,0],['Taxonomy Application',4,0],['Emerging Technology Synthesis',4,0],
         ['Data Ethics',4,0],['Data Governance',4,0],['System Integration',4,0],
         ['Project Management',4,0],['Quality Standards',4,0]]},
    {id:'data-analyst',stage:2,role:'Data Analyst / Associate Data Engineer',anchor:true,execItems:2,
     enrich:'2 live postings · 12 tools · matched via tfidf+ssoc',salary:'S$2.8k – 5.5k',
     produces:'analysis / dashboard deliverable',consumes:'data-engineer',
     sk:[['Data Engineering',2,1],['Database Administration',2,1],['Data Analytics',2,1],
         ['Data Visualisation',3,1],['Data Analytics',3,1],['Stakeholder Management',2,0],
         ['Business Needs Analysis',2,0],['Business Performance Management',3,0],['Design Thinking Practice',3,0],
         ['Budgeting',3,0],['Networking',3,0],['Project Management',3,0],
         ['Data Ethics',3,0],['Business Innovation',4,0]]},
    {id:'data-scientist',stage:3,role:'Data Scientist / Artificial Intelligence Scientist',anchor:false,execItems:0,
     enrich:'1 live posting · 12 tools · matched via tfidf+ssoc',salary:'S$9.8k – 12.5k',
     produces:'model / insight deliverable',consumes:'data-analyst',
     sk:[['Self-Learning Systems',4,0],['Stakeholder Management',4,0],['Computer Vision Technology',4,0],
         ['Emerging Technology Synthesis',4,0],['Computational Modelling',5,0],['Business Innovation',5,0],
         ['Data Ethics',5,0],['Intelligent Reasoning',5,0],['Quality Standards',5,0],
         ['Software Design',5,0],['Test Planning',5,0],['Business Needs Analysis',5,0],
         ['Pattern Recognition Systems',5,0],['Data Design',5,0],['Data Governance',5,0],
         ['Data Strategy',5,0],['Design Thinking Practice',5,0],['Project Management',5,0],
         ['Solution Architecture',5,0],['Text Analytics and Processing',6,0]]}],
  alternates:['Data Architect','Chief Data Officer / Chief Artificial Intelligence Officer'],
  honesty:'Seams are EXERCISED — stage N consumes stage N−1’s real artifact in separate sandboxes — but rubric-assessed, NOT execution-verified. Never blended into the executed number.'};

/* ============ state ============ */
const state={
  screen:'request',
  instr:'Focus on messy inputs; flag anything ambiguous.',
  targets:Object.fromEntries(S.map(s=>[s.id,REAL?s.off:({eng:2,dba:2,ana:4,viz:3,stk:2,eth:0}[s.id]??s.off)])),
  lit:{sf:true,oxy:false,kimi:false,day:false,nos:false},
  runDone:false,copied:false,catalogEnabled:false,serverEnabled:false,
  /* live-server flows (intake → recommend → team editor). Populated only when
     state.serverEnabled is true (the /health probe flips it). The scripted
     demo and AP_REAL/dashboard modes never touch these. */
  intake:{sessionId:null,transcript:[],questions:[],brief:null,ready:false,loading:false,error:null,_round:0},
  team:{id:null,name:'',purpose:'',brief:null,agents:[],loading:false,error:null,
        skills:{},skillsLoading:{},skillsErr:{},addingAgent:false,addRoleId:''}
};
let RUN=0;                       // run-id guard for stale async timelines
const sp=()=>SIMSPEED;
const w=ms=>new Promise(r=>setTimeout(r,ms/sp()));
const onList=()=>S.filter(s=>state.targets[s.id]>0);
const runList=()=>onList().filter(s=>s.exec);
const rubList=()=>onList().filter(s=>!s.exec);
const mean=(list,k)=>list.length?Math.round(list.reduce((a,s)=>a+s[k],0)/list.length):0;
function aggExec(ref){           // real: honest level-points coverage over selection; scripted: mean
  const list=runList();if(!list.length)return 0;
  if(REAL){const req=list.reduce((a,s)=>a+s.req,0)||1;
    const gap=list.reduce((a,s)=>a+(ref?s.gapRef:s.gapBase),0);
    return Math.round((1-gap/req)*100);}
  return mean(list,ref?'ref':'base');
}
function aggRub(ref){
  const list=rubList();if(!list.length)return 0;
  if(REAL){const tot=list.reduce((a,s)=>a+s.total,0)||1;
    return Math.round(100*list.reduce((a,s)=>a+s.covered,0)/tot);}
  return mean(list,ref?'ref':'base');
}
const spent=()=>S.reduce((a,s)=>{const t=state.targets[s.id];return a+(t>0?Math.max(0,t-s.off):0);},0);

/* ============ header: rail + sponsor chips (built once, mutated in place) ============ */
const RAILDEF=[['request','01','REQUEST'],['loadout','02','LOADOUT'],['prove','03','PROVE'],['deliver','04','DELIVER']];
// Live-server flow screens (prepended onto the rail when state.serverEnabled flips
// true after the /health probe). Distinct number prefixes (00/0R/0T) keep them
// visually separated from the scripted-demo 01–04 entries, with a divider.
const RAILDEF_LIVE=[['intake','00','INTAKE'],['recommend','0R','RECOMMEND'],['editor','0T','TEAM EDITOR']];
const railDef=()=>state.serverEnabled
  ? RAILDEF_LIVE.concat([['|','','']]).concat(RAILDEF.map(([s,n,l])=>[s,'D'+n.slice(1),l]))
  : RAILDEF;
const SPONSORS=[['sf','SkillsFuture'],['oxy','Oxylabs'],['kimi','Kimi'],['day','Daytona'],['nos','Nosana']];
function buildHeader(){
  document.getElementById('rail').innerHTML=railDef().map(([sc,num,lb])=>
    sc==='|'?`<span style="width:1px;height:22px;background:${LINE};margin:0 4px;display:inline-block"></span>`
    :`<button id="rail-${sc}" onclick="app.nav('${sc}')" style="background:none;border:1px solid ${LINE};color:${DIM};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:8px 14px;cursor:pointer">${num} ${lb}</button>`).join('');
  document.getElementById('chips').innerHTML=SPONSORS.map(([k,nm])=>
    `<div id="chip-${k}" style="display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid ${LINE};color:${DIM};font-family:${MONO};font-size:11.5px;border-radius:999px;background:${INSET};transition:all .4s">
       <span id="dot-${k}" style="width:6px;height:6px;border-radius:50%;background:#3A3A40;box-shadow:none;transition:all .4s"></span>${nm}</div>`).join('');
}
function updateHeader(){
  const def=railDef();
  const cur=def.findIndex(r=>r[0]===state.screen);
  def.forEach(([sc],i)=>{if(sc==='|')return;const b=document.getElementById('rail-'+sc);if(!b)return;
    b.style.borderColor=i===cur?LIME:LINE;
    b.style.color=i===cur?LIME:(i<cur?INK:DIM);});
  SPONSORS.forEach(([k])=>{const on=state.lit[k],c=document.getElementById('chip-'+k),d=document.getElementById('dot-'+k);
    c.style.borderColor=on?LIME:LINE;c.style.color=on?INK:DIM;
    d.style.background=on?LIME:'#3A3A40';d.style.boxShadow=on?'0 0 10px rgba(200,241,53,.8)':'none';});
}
const lit=k=>{state.lit[k]=true;updateHeader();};

/* ============ shared row templates ============ */
const badge=(ex,short)=>`<span style="font-family:${MONO};font-size:11px;padding:3px 8px;background:${ex?'rgba(200,241,53,.12)':'rgba(156,155,160,.12)'};color:${ex?LIME:MUT}">${ex?(short?'✓ executed':'✓ execution-verified'):(short?'○ rubric':'○ rubric only')}</span>`;
function barRow(s,live){       // live=true → widths/labels start empty and are driven by the sim
  const t=state.targets[s.id];
  const pb=live?null:s.base,pr=live?null:s.ref;
  return `<div style="display:flex;flex-direction:column;gap:8px;padding:13px 0;border-bottom:1px solid ${DIV}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
      <span style="display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:600">${esc(s.nm)}
        <span style="font-family:${MONO};font-size:11.5px;color:${DIM}">L${t}</span>${badge(s.exec,true)}</span>
      <span style="font-family:${MONO};font-size:15px;color:${MUT}"><span id="pb-${s.id}">${pb!=null?pb+'%':'—'}</span> → <b style="color:${LIME}"><span id="pr-${s.id}">${pr!=null?pr+'%':'—'}</span></b></span>
    </div>
    <div style="height:12px;background:${INSET};border:1px solid #1E1E23;position:relative;overflow:hidden">
      <div id="wb-${s.id}" style="position:absolute;top:0;bottom:0;left:0;width:${live?0:s.base}%;background:${AMBER};opacity:.7;transition:width 1.1s cubic-bezier(.4,0,.2,1)"></div>
      <div id="wr-${s.id}" style="position:absolute;top:0;bottom:0;left:0;width:${live?0:s.ref}%;background:${GRAD};transition:width 1.1s cubic-bezier(.4,0,.2,1)"></div>
    </div>
    <div style="font-family:${MONO};font-size:12px;color:${DIM}">${esc(s.ka)}</div>
  </div>`;
}

/* ============ screen 01 · Request ============ */
function renderRequest(){
  const nSkills=REAL?REAL.totalSkills:14,nBatt=REAL?REAL.batteryCount:6;
  return `<section style="max-width:1240px;margin:0 auto;padding:64px 44px;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:26px;padding-top:20px">
    <div style="font-family:${MONO};font-size:13px;letter-spacing:3px;color:${LIME}">01 · REQUEST AN AGENT</div>
    <h1 style="font-family:${UNB};font-weight:900;font-size:52px;line-height:1.08;margin:0;letter-spacing:-.5px">HIRE AN AGENT.<br>WATCH IT<br><span style="color:${LIME}">PROVE ITSELF.</span></h1>
    <p style="font-size:20px;line-height:1.55;color:${MUT};max-width:520px;margin:0;text-wrap:pretty">Pick a real SkillsFuture role. AgentProof generates that role's skill battery, benchmarks the agent by <b style="color:${INK}">executing its work</b> in isolated Daytona sandboxes, then refines it until the gaps close.</p>
    <div style="display:flex;gap:26px;font-family:${MONO};font-size:13px;color:${DIM}">
      <span><b style="color:${INK}">1,977</b> official roles</span>
      <span><b style="color:${INK}">0</b> invented skills</span>
      <span><b style="color:${LIME}">100%</b> of green bars ran as code</span>
    </div>
  </div>
  <div style="background:${PANEL};border:1px solid ${LINE};padding:30px 32px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;gap:8px">
      <div style="flex:1;text-align:center;padding:11px;border:1px solid ${LIME};color:${LIME};font-family:${MONO};font-size:13px;background:rgba(200,241,53,.07)">● I know the role</div>
      <div style="flex:1;text-align:center;padding:11px;border:1px solid ${LINE};color:${DIM};font-family:${MONO};font-size:13px">○ Describe the task</div>
    </div>
    <div>
      <div style="font-family:${MONO};font-size:11.5px;letter-spacing:2px;color:${DIM};margin-bottom:10px">ROLE · SKILLSFUTURE OFFICIAL</div>
      <div style="border:1px solid #2E3A16;background:rgba(200,241,53,.05);padding:18px 20px">
        <div style="font-size:21px;font-weight:700">${esc(ROLE)}</div>
        <div style="display:flex;gap:24px;margin-top:12px;flex-wrap:wrap">
          <div><div style="font-family:${MONO};font-size:10.5px;letter-spacing:1px;color:${DIM}">SECTOR</div><div style="font-size:15px;margin-top:2px">${esc(SECTOR)}</div></div>
          ${IS_DEMO_ROLE?`<div><div style="font-family:${MONO};font-size:10.5px;letter-spacing:1px;color:${DIM}">SSOC</div><div style="font-size:15px;margin-top:2px;font-family:${MONO}">25131</div></div>`:''}
          <div><div style="font-family:${MONO};font-size:10.5px;letter-spacing:1px;color:${DIM}">OFFICIAL SKILLS</div><div style="font-size:15px;margin-top:2px">${nSkills} · ${nBatt} in battery</div></div>
        </div>
      </div>
    </div>
    <div>
      <div style="font-family:${MONO};font-size:11.5px;letter-spacing:2px;color:${DIM};margin-bottom:10px">CUSTOM INSTRUCTIONS</div>
      <textarea id="instr" rows="3" oninput="app.onInstr(this.value)" style="width:100%;box-sizing:border-box;background:${INSET};border:1px solid ${LINE};color:${INK};font-size:15px;padding:14px 16px;resize:vertical;outline:none;line-height:1.5">${esc(state.instr)}</textarea>
    </div>
    <button onclick="app.nav('loadout')" style="background:${LIME};color:#0A0A0C;border:none;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;padding:17px;cursor:pointer;letter-spacing:.3px">Next · Skill loadout →</button>
    ${state.serverEnabled?`<button id="intakeEntry" onclick="app.nav('intake')" class="hv" style="background:none;border:1px solid ${LIME};color:${LIME};font-family:${MONO};font-size:13px;letter-spacing:1px;padding:13px;cursor:pointer">▶ Start with intake interview</button>`:''}
    ${state.catalogEnabled?`<button id="catEntry" onclick="app.openCatalog()" class="hv" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:13px;letter-spacing:1px;padding:13px;cursor:pointer">⌕ Browse role catalog</button>`:''}
  </div>
</section>`;
}

/* ============ screen 02 · Skill Loadout ============ */
function renderLoadout(){
  const rows=S.map(s=>`
    <div id="row-${s.id}" style="display:grid;grid-template-columns:34px 1fr auto 160px;gap:22px;align-items:center;padding:17px 0;border-bottom:1px solid ${DIV};transition:opacity .25s">
      <button id="tick-${s.id}" onclick="app.toggle('${s.id}')" style="width:26px;height:26px;border:1px solid ${PIPB};background:transparent;color:#0A0A0C;font-size:15px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0"></button>
      <div>
        <div style="display:flex;align-items:center;gap:10px;font-size:17.5px;font-weight:600">${esc(s.nm)} ${badge(s.exec,false)}</div>
        <div style="font-family:${MONO};font-size:12px;color:${DIM};margin-top:5px">${esc(s.ka)}</div>
      </div>
      <div style="display:flex;gap:7px">${[1,2,3,4,5,6].map(l=>`
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <button id="pip-${s.id}-${l}" onclick="app.setLevel('${s.id}',${l})" title="L${l}" style="width:32px;height:23px;border:1px solid ${PIPB};background:${INSET};cursor:pointer;padding:0;transition:all .15s"></button>
          <span style="font-family:${MONO};font-size:10px;color:${LIME};height:12px;line-height:12px">${l===s.off?'◆':''}</span>
        </div>`).join('')}</div>
      <div style="text-align:right">
        <div id="lvl-${s.id}" style="font-family:${UNB};font-weight:700;font-size:19px;color:${LIME}"></div>
        <div id="note-${s.id}" style="font-family:${MONO};font-size:11.5px;color:${DIM};margin-top:3px"></div>
      </div>
    </div>`).join('');
  return `<section style="max-width:1240px;margin:0 auto;padding:48px 44px">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:30px">
    <div>
      <div style="font-family:${MONO};font-size:13px;letter-spacing:3px;color:${LIME};margin-bottom:10px">02 · SKILL LOADOUT</div>
      <h2 style="font-family:${UNB};font-weight:700;font-size:30px;margin:0">${esc(ROLE)}</h2>
      <div style="font-family:${MONO};font-size:13px;color:${DIM};margin-top:8px">◆ official required level is free · pushing above it spends proof budget · L0 drops the skill</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;align-items:flex-end">
      <div style="display:flex;gap:8px">
        <button class="hv" onclick="app.preset('baseline')" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:9px 16px;cursor:pointer">BASELINE</button>
        <button class="hv" onclick="app.preset('specialize')" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:9px 16px;cursor:pointer">SPECIALIZE</button>
        <button class="hv" onclick="app.preset('max')" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:9px 16px;cursor:pointer">MAX</button>
      </div>
      ${SHOWBUDGET?`<div style="display:flex;align-items:center;gap:14px;border:1px solid ${LINE};background:${INSET};padding:11px 16px">
        <span style="font-family:${MONO};font-size:11px;letter-spacing:2px;color:${DIM}">PROOF BUDGET</span>
        <div style="display:flex;gap:4px">${[0,1,2,3,4,5,6,7].map(i=>`<div id="mb-${i}" style="width:13px;height:20px;background:${INSET};border:1px solid ${PIPB};transition:all .25s"></div>`).join('')}</div>
        <span id="budgetTxt" style="font-family:${MONO};font-size:13.5px;color:${DIM}"></span>
      </div>`:''}
    </div>
  </div>
  <div style="background:${PANEL};border:1px solid ${LINE};padding:10px 32px 14px">${rows}</div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:26px;flex-wrap:wrap">

const setStage=t=>{const e=document.getElementById('stage');if(e)e.textContent=t;};
function count(id,elId,to,ms){
  const el=document.getElementById(elId);if(!el)return;
  const from=parseInt(el.textContent)||0,t0=performance.now(),dur=ms/sp();
  const step=t=>{if(RUN!==id)return;const k=Math.min(1,(t-t0)/dur);
    const e=document.getElementById(elId);if(!e)return;
    e.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

const _crcTab=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_crcTab[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){   // STORE-method .zip — valid archive, opens on every OS
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=v=>[v&0xFF,(v>>>8)&0xFF],u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  for(const f of files){
    const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(local),nm,data);
    central.push(new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off))),nm);
    off+=local.length+nm.length+data.length;
  }
  let cdSize=0;central.forEach(c=>cdSize+=c.length);
  const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(off),u16(0)));
  return new Blob(parts.concat(central,[eocd]),{type:'application/zip'});
}

function drawTeamLines(){
  const wrap=document.getElementById('chartWrap'),g=document.getElementById('chartLines');
  if(!wrap||!g)return;
  const W=wrap.getBoundingClientRect();
  const rel=el=>{const r=el.getBoundingClientRect();
    return {x:r.left-W.left,y:r.top-W.top,w:r.width,h:r.height,
            cx:r.left-W.left+r.width/2,cy:r.top-W.top+r.height/2};};
  let paths='';
  const n=TEAM.agents.length;
  // main spine: node -> node, artifact chip centered on each connector
  for(let i=0;i<n-1;i++){
    const a=rel(document.getElementById('tnode-'+i)),b=rel(document.getElementById('tnode-'+(i+1)));
    paths+=`<path d="M${a.cx},${a.y+a.h} L${b.cx},${b.y-2}" stroke="${DIM}" stroke-width="1.5" fill="none" marker-end="url(#arrLime)"/>`;
    const chip=document.getElementById('seam-'+i);
    if(chip){chip.style.left=a.cx+'px';chip.style.top=((a.y+a.h+b.y)/2)+'px';}
  }
  // terminal deliverable stub off the last node
  const lastN=rel(document.getElementById('tnode-'+(n-1))),term=document.getElementById('tterm');
  if(term){const t=rel(term);
    paths+=`<path d="M${lastN.cx},${lastN.y+lastN.h} L${t.cx},${t.y-2}" stroke="${DIM}" stroke-width="1.5" fill="none" marker-end="url(#arrLime)"/>`;}
  // dashed elbows: anchor node -> off-path alternates
  const ai=Math.max(0,TEAM.agents.findIndex(a=>a.anchor));
  const src=rel(document.getElementById('tnode-'+ai));
  (TEAM.alternates||[]).forEach((_,i)=>{
    const alt=document.getElementById('talt-'+i);if(!alt)return;
    const t=rel(alt),midX=src.x+src.w+((t.x-(src.x+src.w))/2);
    paths+=`<path d="M${src.x+src.w},${src.cy} L${midX},${src.cy} L${midX},${t.cy} L${t.x-3},${t.cy}" stroke="${DIM}" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrDim)"/>`;
  });
  g.innerHTML=paths;
}

// api() wraps fetch('/api'+path) → parsed JSON. No-op-graceful: returns {error}
// on any failure so callers can render an inline message. When window.AP_REAL
// is set (CLI/dashboard mode) the catalog entry is hidden entirely, so the
// standalone scripted mode + the dashboard short-circuit both keep working.
async function api(path,opts){
  try{
    const r=await fetch('/api'+path,opts||{});
    if(!r.ok)return {error:`${r.status} ${r.statusText}`};
    if(r.status===204)return {ok:true};            // DELETE success — no body
    const ct=r.headers.get('content-type')||'';
    if(ct.includes('application/json'))return await r.json();
    return {error:'non-json response'};
  }catch(e){return {error:String(e)};}
}

// /health probe flips it after /api is confirmed reachable). In standalone
// file:// mode and AP_REAL/dashboard mode they stay hidden — the original
// 01–04 scripted demo is the whole experience. All three reuse the existing
// api() wrapper, the org-chart node idiom, and the per-skill pip pattern.

// The 3 fixed seed questions are app constants (per the production plan);
// the server returns them too, but we fall back to these if it doesn't.
const SEED_QUESTIONS=[
  'What kind of agentic team are you trying to build?',
  'What are your main pain points / bottlenecks today?',
  'What outcome or deliverable would define success?'
];

// Normalise an agent row from either /team/recommend or /team/{id}/agents into
// the shape the editor + chart preview expect (mirrors dashboard.load_real()).
function normTeamAgent(a){
  return{
    agent_id:a.agent_id||a.id||('a'+Math.random().toString(36).slice(2,7)),
    role_id:a.role_id,role:a.role||a.role_id||'Agent',
    stage:a.stage||1,squad:a.squad||'',
    produces:a.produces||'',consumes:a.consumes||'',
    anchor:!!a.anchor,
    skill_overrides:a.skill_overrides||a.skill_level_overrides||{},
    skill_disabled:Array.isArray(a.skill_disabled)?a.skill_disabled:[],
    rationale:a.rationale||'',sk:a.sk||null
  };
}
// effective level = override if present, else the official required level
const effLevel=(a,n)=>{const c=n.code||n.nm;const o=a.skill_overrides;
  return(o&&(c in o))?o[c]:(n.lvl||0);};
const skillOff=(a,n)=>{const c=n.code||n.nm;return(a.skill_disabled||[]).includes(c);};

        <div style="font-family:${MONO};font-size:10.5px;color:${DIM};margin-top:8px">${esc(a.agent_id)}${a.produces?` · produces: ${esc(a.produces)}`:''}${a.consumes?` · consumes: ${esc(a.consumes)}`:''}</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="hv" onclick="app.teamReloadSkills('${esc(a.agent_id)}')" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:11.5px;padding:8px 12px;cursor:pointer">↻ skills</button>
        <button class="hv" onclick="app.deleteAgent('${esc(a.agent_id)}')" style="background:none;border:1px solid ${LINE};color:${RED};font-family:${MONO};font-size:11.5px;padding:8px 12px;cursor:pointer">✕ delete</button>
      </div>
    </div>
    <div style="margin-top:16px;border-top:1px solid ${DIV};padding-top:14px">
      <div style="font-family:${MONO};font-size:11px;letter-spacing:2px;color:${DIM};margin-bottom:10px">PER-SKILL · CLICK PIP TO SET LEVEL · ✓ = ENABLED</div>
      ${body}
    </div>
  </div>`;
}
function renderAddAgentForm(){
  if(!state.team.addingAgent)return '';
  return `<div style="background:${INSET};border:1px dashed ${LIME};padding:14px 18px;margin-bottom:14px">
    <div style="font-family:${MONO};font-size:11px;letter-spacing:1px;color:${LIME};margin-bottom:8px">ADD AGENT · ENTER ROLE_ID</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="addRoleId" type="text" value="${esc(state.team.addRoleId)}" placeholder="role_id (e.g. 1234) or role name" oninput="state.team.addRoleId=this.value" style="flex:1;min-width:220px;background:${INSET};border:1px solid ${LINE};color:${INK};font-size:14px;padding:10px 12px;outline:none">
      <button onclick="app.confirmAddAgent()" style="background:${LIME};color:#0A0A0C;border:none;font-weight:700;font-size:13px;padding:10px 16px;cursor:pointer">Add →</button>
      <button onclick="state.team.addingAgent=false;app.rerenderEditor()" class="hv" style="background:none;border:1px solid ${LINE};color:${MUT};font-size:13px;padding:10px 14px;cursor:pointer">cancel</button>
    </div>
    <div style="margin-top:8px;font-family:${MONO};font-size:10.5px;color:${DIM};line-height:1.5">tip: use ⌕ BROWSE ROLES above to find a role, then copy its role_id here.</div>
  </div>`;
}
function renderEditor(){
  if(!state.team.id){
    return `<section style="max-width:920px;margin:0 auto;padding:48px 44px">
      <div style="font-family:${MONO};font-size:13px;letter-spacing:3px;color:${LIME};margin-bottom:10px">02 · TEAM EDITOR</div>
      <h1 style="font-family:${UNB};font-weight:900;font-size:40px;margin:0 0 16px">No team loaded.</h1>
      <p style="color:${MUT};font-size:16px;line-height:1.6;max-width:560px">Run intake and recommend first, then per-agent skill toggles, add, and delete will be wired to <code style="font-family:${MONO};color:${INK}">/api/team/{id}/agents</code>.</p>
      <button onclick="app.nav('recommend')" style="margin-top:18px;background:${LIME};color:#0A0A0C;border:none;font-weight:700;font-size:15px;padding:12px 24px;cursor:pointer">← Back to recommend</button>
    </section>`;
  }
  const ag=state.team.agents;
  return `<section style="max-width:1240px;margin:0 auto;padding:48px 44px 64px">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:20px;flex-wrap:wrap">
    <div>
      <div style="font-family:${MONO};font-size:13px;letter-spacing:3px;color:${LIME};margin-bottom:8px">02 · TEAM EDITOR</div>
      <h1 style="font-family:${UNB};font-weight:700;font-size:30px;margin:0">${esc(state.team.name||'Team')}</h1>
      <div style="font-family:${MONO};font-size:12px;color:${DIM};margin-top:6px">${ag.length} agent${ag.length===1?'':'s'}${state.team.purpose?` · ${esc(state.team.purpose)}`:''}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="hv" onclick="app.nav('recommend')" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:11px 16px;cursor:pointer">← RECOMMEND</button>
      <button class="hv" onclick="app.openCatalog()" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:11px 16px;cursor:pointer">⌕ BROWSE ROLES</button>
      <button onclick="app.addAgent()" style="background:${LIME};color:#0A0A0C;border:none;font-weight:700;font-size:14px;padding:11px 20px;cursor:pointer">+ Add agent</button>
    </div>
  </div>
  ${state.team.error?`<div style="padding:14px;border:1px solid ${RED};color:${RED};font-family:${MONO};font-size:12.5px;margin-bottom:18px;line-height:1.6">⚠ ${esc(state.team.error)}</div>`:''}
  ${editorChartPreview()}
  ${renderAddAgentForm()}
  <div style="display:flex;flex-direction:column;gap:14px">${ag.map((a,i)=>editorAgentCard(a,i)).join('')}</div>
</section>`;
}

/* ============ app ============ */
const app={
  nav(sc){
    RUN++;state.screen=sc;
    if(sc==='deliver')state.lit.oxy=true;
    const root=document.getElementById('root');
    if(sc==='intake'){
      root.innerHTML=renderIntake();
      renderIntakeTranscript();renderIntakeForm();
      if(state.serverEnabled&&!state.intake.sessionId)this.startIntake();
    }
    else if(sc==='recommend')root.innerHTML=renderRecommend();
    else if(sc==='editor'){root.innerHTML=renderEditor();this.teamAutoLoadSkills();}
    else if(sc==='request')root.innerHTML=renderRequest();
    else if(sc==='loadout'){root.innerHTML=renderLoadout();updateLoadout();}
    else if(sc==='prove'){root.innerHTML=renderProve();setTimeout(runSim,60);}
    else root.innerHTML=renderDeliver();
    updateHeader();window.scrollTo(0,0);
  },
  onInstr(v){state.instr=v;},
  setLevel(id,l){const t=state.targets;t[id]=(t[id]===l)?l-1:l;updateLoadout();},
  toggle(id){const t=state.targets,s=S.find(x=>x.id===id);t[id]=t[id]>0?0:s.off;updateLoadout();},
  preset(p){
    if(REAL){S.forEach(s=>{state.targets[s.id]=p==='max'?6:s.off;});
      if(p==='specialize'&&S.length)state.targets[S[0].id]=Math.min(6,S[0].off+2);}
    else{
      const map={baseline:{eng:2,dba:2,ana:2,viz:3,stk:2,eth:1},
                 specialize:{eng:2,dba:2,ana:5,viz:4,stk:2,eth:0},
                 max:{eng:6,dba:6,ana:6,viz:6,stk:6,eth:6}};
      Object.assign(state.targets,map[p]);}
    updateLoadout();
  },
  openTeam(back){
    const m=document.getElementById('teamModal');
    if(m){if(!back)return;m.outerHTML=renderTeam();}   // back from a skill tree swaps in place
    else document.body.insertAdjacentHTML('beforeend',renderTeam());
    requestAnimationFrame(drawTeamLines);        // measure after layout, then draw connectors
    if(!this._teamRs){this._teamRs=()=>drawTeamLines();window.addEventListener('resize',this._teamRs);}
  },
  openSkillTree(i){
    const m=document.getElementById('teamModal');if(!m)return;
    m.outerHTML=renderSkillTree(i);
  },
  tglSkill(uid){
    const d=document.getElementById('sk-'+uid),cx=document.getElementById('cx-'+uid);
    if(!d)return;const open=d.style.display==='none';
    d.style.display=open?'block':'none';if(cx)cx.textContent=open?'▾':'▸';
  },
  downloadAgent(i){
    const a=TEAM.agents[i];
    saveBlob((a.id||('agent-'+(i+1)))+'.md',new Blob([agentMd(a)],{type:'text/markdown'}));
  },
  downloadTeam(){
    const files=TEAM.agents.map((a,i)=>({name:(a.id||('agent-'+(i+1)))+'.md',text:agentMd(a)}));
    files.unshift({name:'README.md',text:teamReadme()});
    saveBlob('agent-team-specs.zip',zipStore(files));
  },
  closeTeam(){
    const m=document.getElementById('teamModal');if(m)m.remove();
    if(this._teamRs){window.removeEventListener('resize',this._teamRs);this._teamRs=null;}
  },
  copySpec(){
    navigator.clipboard.writeText(buildSpec());
    const btn=document.getElementById('copyBtn');if(!btn)return;
    btn.textContent='✓ copied';setTimeout(()=>{const b=document.getElementById('copyBtn');if(b)b.textContent='⧉ Copy spec';},1600);
  },
  /* ---- catalog (browse-only) ---- */
  async openCatalog(){
    if(document.getElementById('catModal'))return;
    document.body.insertAdjacentHTML('beforeend',renderCatalog());
    if(!catalog.sectors.length){            // one-time sector list load
      const s=await api('/catalog/sectors');
      if(!s.error){catalog.sectors=Array.isArray(s)?s:(s.items||[]);}
      const sel=document.getElementById('catSector');
      if(sel){catalog.sectors.forEach(x=>{if(x&&x.sector){const o=document.createElement('option');o.value=x.sector;o.textContent=`${x.sector} (${x.n_roles})`;sel.appendChild(o);}});}
    }
    if(!catalog.items.length&&!catalog.q)await this.catalogSearch();
  },
  debCatalogSearch(q){
    catalog.q=q;clearTimeout(this._catDeb);
    this._catDeb=setTimeout(()=>this.catalogSearch(),200);
  },
  async catalogSearch(){
    catalog.loading=true;catalog.error=null;
    const res=document.getElementById('catResults');
    if(res)res.innerHTML=renderCatalogResults();
    const p=new URLSearchParams();
    if(catalog.q)p.set('q',catalog.q);
    if(catalog.sector)p.set('sector',catalog.sector);
    p.set('size','20');
    const d=await api('/catalog?'+p.toString());
    catalog.loading=false;
    if(d.error){catalog.error=d.error;catalog.items=[];catalog.total=0;}
    else{catalog.items=d.items||[];catalog.total=d.total||0;}
    const r2=document.getElementById('catResults');
    if(r2)r2.innerHTML=renderCatalogResults();
  },
  catalogSector(s){catalog.sector=s;this.catalogSearch();},
  async selectCatalogRole(roleId){
    catalog.cardLoading=true;catalog.card=null;
    const body=document.getElementById('catBody');
    if(body)body.innerHTML=renderCatalogCardLoading(roleId);
    const d=await api(`/catalog/${roleId}/card`);
    catalog.cardLoading=false;
    if(d.error||!d.role_id){
      if(body)body.innerHTML=`<div style="padding:30px 10px">
        <button onclick="app.backToCatalogList()" class="hv" style="background:none;border:1px solid ${LINE};color:${MUT};font-family:${MONO};font-size:12px;letter-spacing:1px;padding:8px 14px;cursor:pointer;margin-bottom:18px">← BACK TO LIST</button>
        <div style="padding:18px;border:1px solid ${RED};color:${RED};font-family:${MONO};font-size:12.5px;line-height:1.6">⚠ ${esc(d.error||'card not found')}</div>
      </div>`;
      return;
    }
    catalog.card=d;
    if(body)body.innerHTML=renderCatalogCard();
  },
  backToCatalogList(){
    catalog.card=null;catalog.cardLoading=false;
    const body=document.getElementById('catBody');
    if(body)body.innerHTML=renderCatalogList();
  },
  closeCatalog(){
    const m=document.getElementById('catModal');if(m)m.remove();
    clearTimeout(this._catDeb);
  },
  /* ---- screen 00 · intake ---- */
  async startIntake(){
    const I=state.intake;
    if(I.sessionId||I.loading||!state.serverEnabled)return;
    I.loading=true;I.error=null;
    renderIntakeForm();
    const d=await api('/intake/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    I.loading=false;
    if(d.error){I.error=d.error;renderIntakeForm();return;}
    I.sessionId=d.session_id||d.id;
    I.questions=d.questions&&d.questions.length?d.questions:SEED_QUESTIONS.slice();
    I.transcript=I.questions.map(q=>({role:'fixed',content:q,round:0}));
    renderIntakeTranscript();renderIntakeForm();
  },
  async submitIntake(){
    const I=state.intake;if(!I.sessionId)return;
    const qs=I.questions||[];
    const answers=qs.map((_,i)=>{const el=document.getElementById('intakeAns-'+i);return el?el.value.trim():'';});
    if(answers.some(a=>!a)){
      I.error='please answer all questions before submitting.';
      renderIntakeForm();
      setTimeout(()=>{I.error=null;renderIntakeForm();},1600);
      return;
    }
    I._round=(I._round||0)+1;
    answers.forEach((a,i)=>I.transcript.push({role:'user',content:a,round:I._round,q:qs[i]}));
    I.loading=true;I.error=null;I.questions=[];
    renderIntakeForm();
    const d=await api(`/intake/${I.sessionId}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers})});
    I.loading=false;
    if(d.error){I.error=d.error;renderIntakeForm();return;}
    if(d.ready){
      I.ready=true;I.brief=d.brief||null;
      state.team.brief=I.brief;        // seed the recommend screen
      renderIntakeTranscript();renderIntakeForm();
    }else{
      I.questions=(d.questions||[]).slice();
      I.transcript.push(...I.questions.map(q=>({role:'assistant',content:q,round:I._round})));
      renderIntakeTranscript();renderIntakeForm();
    }
  },
  resetIntake(){
    state.intake={sessionId:null,transcript:[],questions:[],brief:null,ready:false,loading:false,error:null,_round:0};
    renderIntakeTranscript();renderIntakeForm();
    return this.startIntake();
  },
  skipToIntakePaste(){
    const pasted=prompt('Paste a JSON brief (or cancel to keep interviewing):');
    if(pasted===null)return;
    try{
      const b=pasted.trim()?JSON.parse(pasted):{};
      state.intake.brief=b;state.intake.ready=true;state.team.brief=b;
      renderIntakeForm();
    }catch(e){alert('invalid JSON brief — fix and retry.');}
  },
  /* ---- screen 01 · recommend ---- */
  async recommendTeam(){
    const brief=state.intake.brief;
    const T=state.team;
    if(!brief){
      T.error='no brief — run intake first.';
      const p=document.getElementById('recommendPreview');if(p)p.innerHTML=renderRecommendPreview();
      return;
    }
    T.loading=true;T.error=null;
    const p=document.getElementById('recommendPreview');if(p)p.innerHTML=renderRecommendPreview();
    let d;
    if(state.intake.sessionId){
      d=await api(`/intake/${state.intake.sessionId}/recommend`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    }else{
      d=await api('/team/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief})});
    }
    T.loading=false;
    if(d.error){T.error=d.error;}
    else{
      T.id=d.team_id||d.id;
      T.name=d.name||'Recommended team';
      T.purpose=d.purpose||'';
      T.agents=(d.agents||[]).map(normTeamAgent);
      T.skills={};T.skillsLoading={};T.skillsErr={};  // fresh caches
    }
    const p2=document.getElementById('recommendPreview');if(p2)p2.innerHTML=renderRecommendPreview();
  },
  /* ---- screen 02 · team editor ---- */
  rerenderEditor(){const r=document.getElementById('root');if(state.screen==='editor'&&r)r.innerHTML=renderEditor();},
  async teamLoadSkills(agentId){
    if(!state.team.id)return;
    const a=state.team.agents.find(x=>x.agent_id===agentId);
    // fast path: agent payload already carries sk rows (chart-shape response)
    if(a&&a.sk&&a.sk.length&&!state.team.skills[agentId]&&!state.team.skillsErr[agentId]){
      state.team.skills[agentId]=a.sk.map(normSkill);
      this.rerenderEditor();
      return;
    }
    if(state.team.skills[agentId]&&!state.team.skillsErr[agentId])return;
    state.team.skillsLoading[agentId]=true;state.team.skillsErr[agentId]='';
    this.rerenderEditor();
    const d=await api(`/team/${state.team.id}/skills/${agentId}`);
    state.team.skillsLoading[agentId]=false;
    if(d.error){state.team.skillsErr[agentId]=d.error;}
    else{state.team.skills[agentId]=(d.skills||d.sk||[]).map(normSkill);}
    this.rerenderEditor();
  },
  teamReloadSkills(aid){return this.teamLoadSkills(aid);},
  async teamAutoLoadSkills(){
    if(!state.team.agents.length)return;
    await Promise.all(state.team.agents
      .filter(a=>!state.team.skills[a.agent_id]&&!state.team.skillsErr[a.agent_id])
      .map(a=>this.teamLoadSkills(a.agent_id)));
  },
  async teamSetLevel(agentId,code,l){
    const T=state.team;const a=T.agents.find(x=>x.agent_id===agentId);if(!a||!T.id)return;
    if(!a.skill_overrides)a.skill_overrides={};
    const cur=a.skill_overrides[code]??(T.skills[agentId]?.find(s=>(s.code||s.nm)===code)?.lvl||0);
    a.skill_overrides[code]=cur===l?Math.max(0,l-1):l;  // click same level → step down
    this.rerenderEditor();
    const d=await api(`/team/${T.id}/agents/${agentId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill_overrides:a.skill_overrides})});
    if(d.error){T.error=d.error;}
    else if(d.agent){Object.assign(a,normTeamAgent(d.agent));}
    this.rerenderEditor();
  },
  async teamToggle(agentId,code){
    const T=state.team;const a=T.agents.find(x=>x.agent_id===agentId);if(!a||!T.id)return;
    if(!a.skill_disabled)a.skill_disabled=[];
    const i=a.skill_disabled.indexOf(code);
    if(i>=0)a.skill_disabled.splice(i,1);else a.skill_disabled.push(code);
    this.rerenderEditor();
    const d=await api(`/team/${T.id}/agents/${agentId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({skill_disabled:a.skill_disabled})});
    if(d.error){T.error=d.error;}
    else if(d.agent){Object.assign(a,normTeamAgent(d.agent));}
    this.rerenderEditor();
  },
  async deleteAgent(agentId){
    const T=state.team;if(!T.id)return;
    if(!confirm('Delete this agent from the team?'))return;
    T.agents=T.agents.filter(a=>a.agent_id!==agentId);
    delete T.skills[agentId];delete T.skillsLoading[agentId];delete T.skillsErr[agentId];
    this.rerenderEditor();
    const d=await api(`/team/${T.id}/agents/${agentId}`,{method:'DELETE'});
    if(d.error&&!d.ok){T.error=d.error;this.rerenderEditor();}
  },
  addAgent(){state.team.addingAgent=true;state.team.addRoleId='';this.rerenderEditor();},
  async confirmAddAgent(){
    const T=state.team;
    const roleId=(T.addRoleId||'').trim();
    if(!roleId){T.error='enter a role_id.';this.rerenderEditor();return;}
    T.addingAgent=false;T.loading=true;T.error=null;
    this.rerenderEditor();
    const d=await api(`/team/${T.id}/agents`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role_id:roleId})});
    T.loading=false;
    if(d.error){T.error=d.error;}
    else if(d.agent){T.agents.push(normTeamAgent(d.agent));}
    this.rerenderEditor();
    // lazily load skills for the freshly-added agent
    if(d&&d.agent){this.teamLoadSkills(normTeamAgent(d.agent).agent_id);}
  }
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){app.closeTeam();app.closeCatalog();}});
buildHeader();app.nav('request');
// catalog + live-flow feature-detect: only enable when /api is reachable (served
// by FastAPI). Hides the entries in CLI/dashboard mode (window.AP_REAL set) AND
// in pure standalone file:// mode, so the scripted demo never shows dead buttons.
// When the probe succeeds we flip state.serverEnabled (gates the intake →
// recommend → team-editor screens) and rebuild the rail so the 00/0R/0T buttons
// appear alongside the scripted 01–04 demo entries.
if(!REAL){api('/health').then(h=>{
  if(h&&!h.error){
    state.catalogEnabled=true;state.serverEnabled=true;
    buildHeader();updateHeader();
    if(state.screen==='request')app.nav('request');      // surface the intake entry button
    else if(state.screen==='intake')app.nav('intake');   // kick off startIntake() now that the gate is open
  }
});}
</script>
