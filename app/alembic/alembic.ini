# Alembic configuration for the AgentProof production app.
# The sqlalchemy.url here is overridden in env.py from app.settings.APP_DB_PATH.
[alembic]
script_location = app/alembic
sqlalchemy.url = sqlite:///data/agentproof.db

# Revision id file template: zero-padded numeric ids (e.g. 0001, 0002).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s
# A simpler numeric-only template is also fine; the one above keeps revisions
# human-sortable. Override with `alembic revision -r <id>` when a fixed id (like
# `0001`) is desired, as we do for the initial migration.

[post_write_hooks]
# None configured — keep migrations hand-reviewable.

# Logging is configured by env.py / the app; quiet Alembic's own logger.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
